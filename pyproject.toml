[project]
name = "anki-chatgpt-free"
version = "0.1.0"
description = "Single-owner, encrypted, on-demand Anki MCP prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anki==26.9.3",
  "fastmcp==4.0.11",
  "httpx==0.28.1",
  "cryptography==50.0.2",
  "py-key-value-aio==0.4.6",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["engine", "storage", "server", "dashboard", "connector", "cloud_sync", "card_media", "pages_crypto", "pages_site", "anki_media"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
