name: Publish encrypted Anki Pages

"on":
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "AnkiWeb update or locally imported encrypted seed"
        type: choice
        options: [ankiweb, seed]
        default: ankiweb
      discard_previous:
        description: "Fresh AnkiWeb import, ignoring old encrypted data (password rotation)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "pages-data/snapshot.enc.json"
      - "web/**"
      - "pages_site.py"
      - "pages_crypto.py"
      - "dashboard.py"
      - "card_media.py"
      - "note_identity.py"
      - "note_edits.py"
      - "cloud_sync.py"
      - "anki_media.py"
      - "cloud_tags.py"
      - "github_tag_queue.py"
      - "tag_import.py"
      - "connector.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ankiweb-refresh.yml"

permissions:
  contents: read

# All Pages publishers share this group. Never cancel a successful refresh mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.ANKI_AUTO_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: anki-sync
    permissions:
      contents: read
      pages: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: pages
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12.14
          enable-cache: true
      - name: Import owner-approved encrypted tag and note requests into AnkiWeb
        if: vars.ANKI_TAG_IMPORT_ENABLED != 'false' && inputs.source != 'seed'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANKI_TAG_IMPORT_ENABLED: ${{ vars.ANKI_TAG_IMPORT_ENABLED || 'true' }}
          PAGES_PASSWORD: ${{ secrets.PAGES_PASSWORD }}
          ANKIWEB_HKEY: ${{ secrets.ANKIWEB_HKEY }}
          ANKIWEB_ENDPOINT: ${{ secrets.ANKIWEB_ENDPOINT }}
        run: uv run --frozen python github_tag_queue.py
      - name: Read Anki, encrypt data and images, build static site
        env:
          PAGES_PASSWORD: ${{ secrets.PAGES_PASSWORD }}
          ANKIWEB_HKEY: ${{ secrets.ANKIWEB_HKEY }}
          ANKIWEB_ENDPOINT: ${{ secrets.ANKIWEB_ENDPOINT }}
          ANKI_TIMEZONE: ${{ vars.ANKI_TIMEZONE || 'Asia/Tokyo' }}
          PAGES_PREVIOUS_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_SOURCE: ${{ inputs.source || 'ankiweb' }}
          PAGES_DISCARD_PREVIOUS: ${{ inputs.discard_previous && 'true' || 'false' }}
        run: uv run --frozen python pages_site.py --source "$PAGES_SOURCE" --previous-url "$PAGES_PREVIOUS_URL"
      - name: Upload public assets and ciphertext only
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
