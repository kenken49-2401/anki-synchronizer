name: Publish initial app screen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
        id: pages
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12.14
          enable-cache: true
      - name: Build public interface only if encrypted data is absent
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: uv run --frozen python scripts/pages_bootstrap.py "$PAGES_BASE_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify the public app responds
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$PAGES_URL" --output "$RUNNER_TEMP/atlas-index.html"
          python3 - <<'PY'
          import os
          from pathlib import Path
          page = (Path(os.environ["RUNNER_TEMP"]) / "atlas-index.html").read_text()
          assert 'name="anki-atlas-setup" content="pending"' in page
          assert './app.js?v=' in page
          print("Public app URL returned the initial application successfully.")
          PY
