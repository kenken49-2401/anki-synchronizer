name: Dashboard checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12.14
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run Python tests
        run: uv run --frozen pytest -q
      - name: Check browser JavaScript
        run: |
          node --check web/app.js
          node --check web/stats.mjs
      - name: Verify learning statistics
        run: node --test tests/stats.test.mjs
