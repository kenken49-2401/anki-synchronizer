name: Dashboard checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12.14
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run Python tests
        run: uv run --frozen pytest -q
      - name: Check browser JavaScript
        run: |
          for script in web/*.js web/*.mjs; do
            node --check "$script"
          done
      - name: Verify learning statistics
        run: node --test tests/*.test.mjs

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12.14
          enable-cache: false
      - name: Check the Windows launcher
        shell: pwsh
        run: |
          & .\Anki-Atlas.cmd --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify isolated updates on Windows
        shell: pwsh
        run: |
          $testScript = @'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_desktop_update.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          for test, detail in result.failures + result.errors:
              message = (test.id() + '\n' + detail)[-5000:]
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error file=tests/test_desktop_update.py::' + message)
          sys.exit(not result.wasSuccessful())
          '@
          uv run --no-project --python 3.12 python -c $testScript
