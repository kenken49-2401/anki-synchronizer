name: Prepare encrypted ChatGPT bootstrap
"on":
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: study-assistant-import
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12.14
          enable-cache: true
      - name: Prepare encrypted full study snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STUDY_ATLAS_PASSWORD: ${{ secrets.STUDY_ATLAS_PASSWORD }}
          ASSISTANT_IMPORT_KEY: ${{ secrets.ASSISTANT_IMPORT_KEY }}
        run: uv run --frozen python scripts/study_chatgpt_bootstrap.py

# Temporary encrypted bootstrap; plaintext is only copied to the private repository.
