name: Correct Kawai 2026 autumn exam date
"on":
  push:
    branches: [main]
    paths:
      - ".github/workflows/study-kawai-date.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: study-assistant-import
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12.14
          enable-cache: true
      - name: Correct encrypted exam date
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STUDY_ATLAS_PASSWORD: ${{ secrets.STUDY_ATLAS_PASSWORD }}
        run: uv run --frozen python scripts/assistant_kawai_date.py
